# The nightly edition (ADR-0009, ADR-0012, ADR-0014, ADR-0021).
# Every night at 00:40 UTC: build yesterday's edition, film every story, direct the films with
# Claude (Haiku 5.5, template fallback), refresh the three editions before it (results and
# reports still fill in), bake the day-at-a-glance replay, validate everything, and commit only
# the data as a `data:` commit. The push triggers the Vercel deploy.
# The API key lives only in the repository secret ANTHROPIC_API_KEY; without it the films keep
# their template narration and nothing breaks.
name: Nightly edition

on:
  # 00:40: yesterday's edition, from what the news reported (the outlets and Current events),
  # never waiting for Wikipedia's most-read list, which comes hours or days late (ADR-0021).
  # 11:30 and 17:30: rebuild editions made without that list once it is published (it adds
  # readers), refresh the editions before today (11:30), and build any edition still missing.
  schedule:
    - cron: "40 0 * * *"
    - cron: "30 11 * * *"
    - cron: "30 17 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Edition date to (re)build (YYYY-MM-DD); default: any missing of the last 7 days"
        required: false

permissions:
  contents: write

concurrency:
  group: nightly-edition
  cancel-in-progress: false

jobs:
  edition:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Downloads and Claude answers are cached between nights: polite to the free APIs, and
      # re-directing an unchanged film costs nothing.
      - name: Restore the download cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: edition-cache-${{ github.run_id }}
          restore-keys: edition-cache-

      - name: Build, film and direct
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          INPUT_DATE: ${{ inputs.date }}
        run: |
          set -uo pipefail
          # Fresh outlets' headlines first: the edition matches them to its stories (ADR-0017).
          # The last 72 hours live on the now-data branch (news.yml, ADR-0018).
          if git fetch --depth=1 origin now-data 2>/dev/null; then
            git show FETCH_HEAD:now.json > public/now/now.json
          fi
          pnpm news || echo "::warning::news feeds unavailable; editions built without coverage"

          # Build every missing edition of the last week, oldest first (or the one asked): a week,
          # because Wikimedia's page views have stalled for more than a day before (9 November
          # 2026), and a date that leaves the window is never built.
          built=""
          for k in 7 6 5 4 3 2 1; do
            D="$(date -u -d "today -$k days" +%F)"
            if [ -n "${INPUT_DATE:-}" ] && [ "$D" != "$INPUT_DATE" ]; then continue; fi
            if [ -z "${INPUT_DATE:-}" ] && [ -f "public/editions/$D/edition.json" ]; then continue; fi
            # GitHub runs this step with `bash -e`, so a bare failing command would end the whole
            # step: capture the code instead, so "not published yet" (2) skips only that date.
            code=0
            pnpm edition "$D" || code=$?
            if [ $code -eq 2 ]; then
              echo "::warning::most-read list for $D not published yet; the next run retries"
              continue
            elif [ $code -ne 0 ]; then
              exit $code
            fi
            built="$built $D"
            # One failed film must not sink the edition: it simply has no film (listed as text).
            pnpm stories "$D" || echo "::warning::some films of $D failed"
            pnpm direct "$D" --ai --max-usd=0.25 || echo "::warning::narration of $D kept as template"
            pnpm bake daily "$D" || echo "::warning::day-at-a-glance replay of $D skipped"
          done

          # Editions of the last two days built before Wikipedia's most-read list was out: rebuild
          # each once the list is published (exit 3: still not published). Two days, because the
          # outlets' headlines it re-reads are kept for 72 hours.
          if [ -z "${INPUT_DATE:-}" ]; then
            for k in 2 1; do
              D="$(date -u -d "today -$k days" +%F)"
              F="public/editions/$D/edition.json"
              case " $built " in *" $D "*) continue ;; esac
              if [ -f "$F" ] && grep -q '"mostRead": false' "$F"; then
                code=0
                pnpm edition "$D" --need-readers || code=$?
                if [ $code -eq 0 ]; then
                  built="$built $D"
                  pnpm stories "$D" || echo "::warning::some films of $D failed"
                  pnpm direct "$D" --ai --max-usd=0.25 || echo "::warning::narration of $D kept as template"
                elif [ $code -ne 3 ]; then
                  echo "::warning::rebuilding $D with readers failed"
                fi
              fi
            done
          fi

          # The three editions before today stay fresh (ADR-0014): re-film and re-direct them
          # once a day, on the first run (re-directing costs tokens when articles changed).
          refreshed=""
          if [ "$(date -u +%H)" = "11" ] || [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            for k in 1 2 3; do
              D="$(date -u -d "today -$k days" +%F)"
              case " $built " in *" $D "*) continue ;; esac
              if [ -f "public/editions/$D/edition.json" ]; then
                pnpm stories "$D" || echo "::warning::some films of $D failed"
                pnpm direct "$D" --ai --max-usd=0.10 || echo "::warning::narration of $D kept as template"
                refreshed="$refreshed $D"
              fi
            done
          fi
          echo "BUILT=${built# }" >> "$GITHUB_ENV"
          echo "REFRESHED=${refreshed# }" >> "$GITHUB_ENV"

      # Films older than two weeks move to this year's archive repository, published by GitHub
      # Pages (ADR-0027). The archive is pushed first; only then do the films leave this
      # repository (each edition keeps films.json saying where they went). Without the deploy
      # key (scripts/setup-archive.sh), nothing moves.
      - name: Move old films to the archive
        env:
          ARCHIVE_DEPLOY_KEY: ${{ secrets.ARCHIVE_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          dates="$(node scripts/archive.ts plan)"
          if [ -z "$dates" ]; then echo "Nothing to archive."; exit 0; fi
          if [ -z "${ARCHIVE_DEPLOY_KEY:-}" ]; then
            echo "::warning::films older than two weeks wait: no ARCHIVE_DEPLOY_KEY (run scripts/setup-archive.sh)"
            exit 0
          fi
          year="$(date -u +%Y)"
          repo="earthlog-archive-$year"
          base="https://abmoh4219.github.io/$repo/"
          key="$(mktemp)"
          printf '%s\n' "$ARCHIVE_DEPLOY_KEY" > "$key"
          chmod 600 "$key"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          dir="$(mktemp -d)"
          git clone -q --depth=1 "git@github.com:abmoh4219/$repo.git" "$dir"
          for d in $dates; do node scripts/archive.ts copy "$d" "$dir"; done
          (
            cd "$dir"
            git config user.name "earthlog-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -q -m "data: archive $(echo $dates | tr '\n' ' ')"
            git push -q
          )
          rm -f "$key"
          for d in $dates; do node scripts/archive.ts finalize "$d" "$base"; done
          echo "ARCHIVED=$(echo $dates | tr '\n' ' ')" >> "$GITHUB_ENV"

      - name: Validate every bundle
        run: pnpm validate:scenes

      - name: No secrets in the data
        run: |
          if grep -rEq "sk-ant-[A-Za-z0-9_-]{10,}" public; then
            echo "::error::Something that looks like an Anthropic API key is in public/."
            exit 1
          fi

      - name: Commit the data
        run: |
          git config user.name "earthlog-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/editions public/scenes
          # The bundled headlines ride along only with real edition changes (no commit per run).
          if [ -n "$BUILT$REFRESHED" ]; then git add public/now; fi
          if git diff --cached --quiet; then
            echo "Nothing new."
          else
            msg="data: edition ${BUILT:-refresh ${REFRESHED}}"
            if [ -n "${ARCHIVED:-}" ]; then msg="$msg; archive ${ARCHIVED}"; fi
            git commit -m "$msg"
            # A commit may have landed during the run: replay this data commit on top.
            git pull --rebase
            git push
          fi
