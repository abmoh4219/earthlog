# Outlets' headlines, every hour (ADR-0017, ADR-0018).
# Reads each outlet's official RSS feed, keeps 72 hours of headlines (headline, link, time:
# never the article), groups them into stories and films the hottest five (ADR-0020). The
# result, now.json and films/, is force-pushed to the `now-data` branch as a single commit: the branch never grows,
# main gets no hourly commits and Vercel no hourly deploys (that branch carries its own
# vercel.json turning deployments off). The site reads the file from raw.githubusercontent.com
# while /now is open; the nightly edition reads it to credit the outlets of each story.
name: News

on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: now-data
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The last 72 hours live on the branch: start from there, so headlines older than the
      # feeds' own window are kept until they age out.
      - name: Restore the headlines
        run: |
          if git fetch --depth=1 origin now-data 2>/dev/null; then
            git show FETCH_HEAD:now.json > public/now/now.json
          fi

      - name: Read the feeds
        run: pnpm news

      - name: Publish to the now-data branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          dir="$(mktemp -d)"
          # now.json and this hour's films (films/<story>/scene.json, evidence.json, sources.json).
          cp -r public/now/. "$dir/"
          printf '{\n  "git": { "deploymentEnabled": false }\n}\n' > "$dir/vercel.json"
          cd "$dir"
          git init -q -b now-data
          git config user.name "earthlog-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "data: news $(date -u +%FT%H:%MZ)"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" now-data
